# CARKit learning annotation: documents runtime settings consumed by the surrounding package.
services:
  carkit:
    image: ariiees/carkit:latest
    container_name: carkit
    privileged: true
    network_mode: host
    ipc: host
    shm_size: 6g
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - ..:/workspaces/CARKit
      - ./entrypoint.sh:/entrypoint.sh:ro
    working_dir: /workspaces/CARKit
    command: ./docker/start_webui.sh
    restart: unless-stopped
