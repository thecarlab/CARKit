# Initial bench configuration. Calibrate gains, steering center, wheelbase and
# launch-file mounting transforms on each vehicle before driving/navigation.
vesc_driver:
  ros__parameters:
    port: /dev/carkit_vesc
    speed_min: -2500.0
    speed_max: 2500.0
    servo_min: 0.15
    servo_max: 0.85
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    current_min: 0.0
    current_max: 0.0
    brake_min: 0.0
    brake_max: 0.0
    position_min: 0.0
    position_max: 0.0
ackermann_to_vesc:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5
vesc_to_odom:
  ros__parameters:
    speed_to_erpm_gain: 4614.0
    speed_to_erpm_offset: 0.0
    steering_angle_to_servo_gain: -1.2135
    steering_angle_to_servo_offset: 0.5
    wheelbase: 0.33
    odom_frame: odom
    base_frame: base_link
    publish_tf: true
    use_servo_cmd_to_calc_angular_velocity: true
carkit_rplidar:
  ros__parameters:
    channel_type: serial
    serial_port: /dev/carkit_rplidar
    serial_baudrate: 1000000
    frame_id: laser
    inverted: false
    angle_compensate: true
    scan_mode: DenseBoost
/camera/camera:
  ros__parameters:
    enable_color: true
    enable_depth: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    rgb_camera.color_profile: 640x480x15
